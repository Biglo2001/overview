<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Overview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      position: relative;
      width: 90%;
      max-width: 500px;
      min-height: 300px;
      padding: 70px 30px 40px;
      border: 2px solid #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      margin: 0 0 35px;
      font-size: 2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      align-items: center;
    }

    .game-button {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 15px 20px;
      color: #fff;
      background: #000;
      border: 2px solid #fff;
      text-decoration: none;
      font-size: 1rem;
      text-align: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .game-button:hover {
      transform: scale(1.08);
    }

    .game-button:active {
      background: #333;
    }

    #music-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      color: #fff;
      background: #000;
      border: 2px solid #fff;
      cursor: pointer;
      font-size: 1.2rem;
    }

    #music-toggle:hover {
      background: #333;
    }

    #snow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .snowflake {
      position: absolute;
      top: -15px;
      width: 8px;
      height: 8px;
      background: #fff;
      opacity: 0.75;
      clip-path: polygon(
        50% 0%,
        100% 38%,
        82% 100%,
        18% 100%,
        0% 38%
      );
      animation: snowfall var(--duration) linear var(--delay) infinite;
    }

    @keyframes snowfall {
      from {
        transform: translateY(-15px) rotate(0deg);
      }

      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="snow" aria-hidden="true"></div>
  <div class="container">
    <button id="music-toggle" aria-label="Toggle music">♫</button>

    <h1>Overview</h1>

    <div class="buttons">
      <a class="game-button" href="https://biglo2001.github.io/card_rpg/game(2)_gpt.html">
        RPG prototype
      </a>

      <a class="game-button" href="https://biglo2001.github.io/card_rpg/the-long-road_claude.html">
        RPG prototype v2
      </a>

      <a class="game-button" href="https://biglo2001.github.io/drummachine/main.html">
        Drummachine
      </a>
    </div>

    <audio id="background-music" loop>
      <source src="main_music1.wav" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const musicToggle = document.getElementById("music-toggle");
    const music = document.getElementById("background-music");

    musicToggle.addEventListener("click", () => {
      if (music.paused) {
        music.play();
        musicToggle.textContent = "♫";
        musicToggle.setAttribute("aria-label", "Turn music off");
      } else {
        music.pause();
        musicToggle.textContent = "🔇";
        musicToggle.setAttribute("aria-label", "Turn music on");
      }
    });

    const snow = document.getElementById("snow");

    for (let i = 0; i < 40; i++) {
      const flake = document.createElement("span");

      flake.className = "snowflake";
      flake.style.left = `${Math.random() * 100}%`;
      flake.style.width = `${4 + Math.random() * 7}px`;
      flake.style.height = flake.style.width;
      flake.style.opacity = `${0.4 + Math.random() * 0.6}`;
      flake.style.setProperty("--duration", `${10 + Math.random() * 10}s`);
      flake.style.setProperty("--delay", `${Math.random() * -20}s`);

      snow.appendChild(flake);
    }
  </script>
</body>
</html>
